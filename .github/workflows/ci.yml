name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (strict) - shared, server, client
        run: npm run typecheck
      - name: Tests - schemas, domain rules, REST API, React UI
        run: npm test
      - name: Production build
        run: npm run build
